apiVersion: datasance.com/v3
kind: ControlPlane
metadata:
  name: iofog
spec:
  # endpoint: https://controller.example.com
  ca: 
  iofogUser:
    name: Foo
    surname: Bar
    email: user@domain.com
    password: "TestPassword12!"
  controller:
    publicUrl: https://192.168.105.2:51121
    consoleUrl: https://192.168.105.2:80
    logLevel: debug
    package:
      image: emirhandurmus/controller:3.8.0-rc.7
  auth:
    mode: embedded
    insecureAllowHttp: false
    # insecureAllowBootstrapLog: false
    # issuerUrl: https://x/realms/datasance
    # client:
    #   id: pot-controller
    #   secret: 
    bootstrap:
      username: admin
      password: "LocalTest12!"
  systemMicroservices:
    router:
      amd64: ghcr.io/datasance/router:3.8.0-rc.1
      arm64: ghcr.io/datasance/router:3.8.0-rc.1
      riscv64: ghcr.io/datasance/router:3.8.0-rc.1
      arm: ghcr.io/datasance/router:3.8.0-rc.1
    nats:
      amd64: ghcr.io/datasance/nats:2.14.2-rc.2
      arm64: ghcr.io/datasance/nats:2.14.2-rc.2
      riscv64: ghcr.io/datasance/nats:2.14.2-rc.2
      arm: ghcr.io/datasance/nats:2.14.2-rc.2
  routerSiteCA:
    tlsCert: 
    tlsKey: 
  routerLocalCA:
    tlsCert: 
    tlsKey: 
  natsSiteCA:
    tlsCert: 
    tlsKey: 
  natsLocalCA:
    tlsCert: 
    tlsKey: 
  tls:
    cert: 
    key: 
    ca: 
  nats:
    enabled: true
  events:
    auditEnabled: true
    retentionDays: 14
    cleanupInterval: 86400
    captureIpAddress: true
  controllers:
    - name: controller-1
      host: 0.0.0.0
      ssh:
        user: emirhan
        keyFile: /Users/emirhan/.lima/_config/user
        port: 57923
      systemAgent:
        package:
          version: v1.0.0-rc.7
          wasm:
            spin:
              url: https://github.com/spinframework/containerd-shim-spin/releases/download/v0.25.1/containerd-shim-spin-v2-linux-aarch64.tar.gz
            edgelet-wasmtime:
              url: https://github.com/Datasance/containerd-shim-edgelet/releases/download/v0.1.0/containerd-shim-edgelet-wasm-v2-aarch64-linux-gnu.tar.gz
        config:
          host: 192.168.105.2
          arch: arm64
          containerEngine: edgelet
          deploymentType: native
          networkInterface: dynamic
