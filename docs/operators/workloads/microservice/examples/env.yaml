# Deploy Secret and ConfigMap in the same namespace before the microservice,
# or include them as preceding documents in one multi-doc file.
---
apiVersion: datasance.com/v3
kind: Secret
metadata:
  name: postgres-creds
  namespace: my-ecn
spec:
  type: Opaque
data:
  password: changeme
---
apiVersion: datasance.com/v3
kind: ConfigMap
metadata:
  name: platform-config
  namespace: my-ecn
spec:
  immutable: false
  useVault: false
data:
  features: '{"darkMode":true}'
---
apiVersion: datasance.com/v3
kind: Microservice
metadata:
  name: api
  namespace: my-ecn
spec:
  agent:
    name: edge-node-1
  application:
    name: my-app
  container:
    catalogItem:
      name: my-api-image
    env:
      - key: LOG_LEVEL
        value: debug
      - key: DB_PASSWORD
        valueFromSecret: postgres-creds/password
      - key: FEATURE_FLAGS
        valueFromConfigMap: platform-config/features
