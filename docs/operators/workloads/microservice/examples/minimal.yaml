apiVersion: datasance.com/v3
kind: Microservice
metadata:
  name: api
  namespace: my-ecn
spec:
  application: myapp
  agent:
    name: edge-01
  images:
    registry: remote
    amd64: ghcr.io/datasance/example/api:1.0.0
    arm64: ghcr.io/datasance/example/api:1.0.0
  container:
    ports:
      - internal: 8080
        external: 8080
        protocol: tcp
  config: {}
  natsConfig:
    natsAccess: false
