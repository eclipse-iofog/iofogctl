apiVersion: datasance.com/v3
kind: Agent
metadata:
  name: edge-node-1
spec:
  host: 10.0.0.50
  ssh:
    user: ubuntu
    keyFile: ~/.ssh/id_rsa
    port: 22
  package:
    version: "1.1.0"
  config:
    description: Production edge node
    host: 10.0.0.50
    arch: amd64
    deploymentType: native
    containerEngine: edgelet
    containerEngineUrl: unix:///run/edgelet/containerd.sock
    diskLimit: 50
    diskDirectory: /var/lib/edgelet/
    memoryLimit: 4096
    cpuLimit: 80
    logLimit: 10
    logDirectory: /var/log/edgelet/
    logFileCount: 10
    statusFrequency: 10
    changeFrequency: 10
    watchdogEnabled: false
    gpsMode: auto
    gpsScanFrequency: 60
    edgeGuardFrequency: 0
    upstreamRouters:
      - default-router
    routerConfig:
      routerMode: edge
      messagingPort: 5671
      edgeRouterPort: 45671
      interRouterPort: 55671
    upstreamNatsServers:
      - default-nats-hub
    natsConfig:
      natsMode: leaf
      natsServerPort: 4222
      natsLeafPort: 7422
      natsMqttPort: 8883
      natsHttpPort: 8222
      jsStorageSize: 10g
      jsMemoryStoreSize: 1g
    pruningFrequency: 0
    logLevel: INFO
    availableDiskThreshold: 90
