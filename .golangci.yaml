# golangci-lint v2 — Go 1.26.4, module github.com/eclipse-iofog/iofogctl
#
# Layers:
#   1. edgelet/.golangci.yaml parity (govet, revive, staticcheck, errcheck, misspell, errorlint)
#   2. iofogctl addons: depguard import allowlist + golang.org/x/* + gopkg.in/yaml.v2
#   3. Legacy monolith exemptions (revive rules + ST1003) — re-enable incrementally

version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - ^\.cursor/
      - ^vendor/

linters:
  default: none
  enable:
    - govet
    - revive
    - staticcheck
    - errcheck
    - misspell
    - errorlint
    - depguard
  settings:
    revive:
      enable-all-rules: true
      rules:
        - {name: add-constant, disabled: true}
        - {name: argument-limit, disabled: true}
        - {name: cognitive-complexity, disabled: true}
        - {name: confusing-naming, disabled: true}
        - {name: confusing-results, disabled: true}
        - {name: cyclomatic, disabled: true}
        - {name: early-return, disabled: true}
        - {name: empty-block, disabled: true}
        - {name: enforce-switch-style, disabled: true}
        - {name: flag-parameter, disabled: true}
        - {name: function-length, disabled: true}
        - {name: function-result-limit, disabled: true}
        - {name: import-shadowing, disabled: true}
        - {name: line-length-limit, disabled: true}
        - {name: max-control-nesting, disabled: true}
        - {name: max-public-structs, disabled: true}
        - {name: redundant-import-alias, disabled: true}
        - {name: unsecure-url-scheme, disabled: true}
        - {name: unused-parameter, disabled: true}
        - {name: unused-receiver, disabled: true}
        - {name: use-waitgroup-go, disabled: true}
        - {name: var-naming, disabled: true}
        # iofogctl legacy monolith — re-enable in hygiene sprint
        - {name: bare-return, disabled: true}
        - {name: package-directory-mismatch, disabled: true}
        - {name: if-return, disabled: true}
        - {name: unhandled-error, disabled: true}
        - {name: use-fmt-print, disabled: true}
        - {name: deep-exit, disabled: true}
        - {name: unexported-naming, disabled: true}
        - {name: use-any, disabled: true}
        - {name: empty-lines, disabled: true}
        - {name: comment-spacings, disabled: true}
        - {name: unnecessary-stmt, disabled: true}
        - {name: useless-break, disabled: true}
        - {name: use-slices-sort, disabled: true}
        - {name: identical-switch-branches, disabled: true}
        - {name: indent-error-flow, disabled: true}
        - {name: identical-ifelseif-branches, disabled: true}
        - {name: use-errors-new, disabled: true}
        - {name: struct-tag, disabled: true}
        - {name: get-return, disabled: true}
        - {name: unchecked-type-assertion, disabled: true}
        - {name: unnecessary-format, disabled: true}
        - {name: identical-branches, disabled: true}
        - {name: datarace, disabled: true}
        - {name: package-naming, disabled: true}
        - {name: import-alias-naming, disabled: true}
        - {name: defer, disabled: true}
        - {name: var-declaration, disabled: true}
        - {name: unreachable-code, disabled: true}
        - {name: redundant-build-tag, disabled: true}
        - {name: redefines-builtin-id, disabled: true}
    staticcheck:
      checks:
        - all
        - -SA1019
        - -ST1003
    misspell:
      locale: US
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    depguard:
      rules:
        main:
          list-mode: strict
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/eclipse-iofog/iofogctl
            - github.com/eclipse-iofog/iofog-go-sdk/v3
            - github.com/eclipse-iofog/iofog-operator
            - github.com/spf13/cobra
            - github.com/mitchellh/go-homedir
            - github.com/pkg
            - github.com/twmb/algoimpl
            - go.podman.io/image
            - github.com/opencontainers/go-digest
            - github.com/gorilla/websocket
            - github.com/vmihailenco/msgpack
            - github.com/docker
            - k8s.io
            - sigs.k8s.io/controller-runtime
            - github.com/briandowns/spinner
            - gopkg.in/yaml.v2
            - golang.org/x/crypto
            - golang.org/x/oauth2
            - golang.org/x/sys
            - golang.org/x/term
  exclusions:
    generated: lax
    paths:
      - ^\.cursor/
      - ^vendor/
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

run:
  timeout: 5m
