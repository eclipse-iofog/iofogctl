# TLS Secret for kind: CertificateAuthority with spec.type: direct
# Each data value is base64(PEM bytes), single line — NOT a literal PEM block in YAML.
#
#   base64 -i tls.crt.pem | tr -d '\n'
#   base64 -i tls.key.pem | tr -d '\n'
apiVersion: datasance.com/v3
kind: Secret
metadata:
  name: my-import-ca
  namespace: my-ecn
spec:
  type: tls
data:
  tls.crt: LS0tLS1CRUdJTi...replace-with-base64-of-pem...
  tls.key: LS0tLS1CRUdJTi...replace-with-base64-of-pem...
  ca.crt: LS0tLS1CRUdJTi...optional-same-as-tls.crt-for-ca-bundle...
